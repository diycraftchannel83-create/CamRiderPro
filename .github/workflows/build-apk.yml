name: CamRiderPro Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/embedded-hud-build-workflow
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - '**.kt'
      - '**.xml'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: camriderpro-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CamRiderPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
